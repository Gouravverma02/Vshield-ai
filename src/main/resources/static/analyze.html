<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze — VShield.ai</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<canvas id="matrixCanvas" aria-hidden="true"></canvas>

<div class="page-overlay">
    <nav class="navbar" id="navbar">
        <a href="dashboard.html" class="brand"><span aria-hidden="true">🛡</span> VShield.ai</a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="analyze.html" class="nav-link active" aria-current="page">Analyze</a>
        <a href="history.html" class="nav-link">History</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <main id="main" class="wide-container">
        <h1 class="page-title">Analyze a message</h1>
        <p class="page-subtitle">Paste a suspicious message, email, or link below to check it for scam signals.</p>

        <div class="card">
            <form onsubmit="submitAnalysis(event)" novalidate>
                <label for="messageInput">Message, email, or link</label>
                <textarea id="messageInput" placeholder="Paste the message, email, or link here..." aria-describedby="charCount" maxlength="5000"></textarea>
                <div id="charCount" class="field-hint">0 / 5000 characters</div>

                <div id="errorBox" class="error-message" role="alert"></div>
                <div id="loadingBox" class="loading-inline"><span class="spinner" aria-hidden="true"></span> Analyzing your message...</div>

                <button type="submit" id="analyzeBtn" class="btn-primary" style="max-width:220px;">Analyze</button>
            </form>

            <div id="resultBox" class="verdict-card result-inline" role="region" aria-live="polite" aria-label="Analysis result"></div>
        </div>
    </main>

    <footer class="site-footer">Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.</footer>
</div>

<script src="auth.js"></script>
<script src="analyze.js"></script>
<script src="nav.js"></script>
<script>
    requireAuth();
    initMatrixBackground();
</script>
</body>
</html>
