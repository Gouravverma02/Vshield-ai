<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analyze — VShield.ai</title>
    <link rel="stylesheet" href="Style.css">
    <style>
        .analyze-box {
            background: #151a3d;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 28px;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }
        textarea:focus { border-color: #E63946; }
        textarea::placeholder { color: #6b7280; }

        .analyze-btn {
            margin-top: 16px;
            background: linear-gradient(135deg, #E63946, #c9303c);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(230,57,70,0.3);
            transition: transform 0.15s;
        }
        .analyze-btn:hover { transform: translateY(-2px); }
        .analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-message {
            background: rgba(231,76,60,0.15);
            border: 1px solid rgba(231,76,60,0.4);
            color: #ff8a80;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 14px;
            display: none;
        }

        .loading {
            display: none;
            color: #9aa7d1;
            margin-top: 14px;
            font-size: 13px;
        }

        .verdict-card {
            margin-top: 24px;
            border-radius: 12px;
            padding: 22px 24px;
            display: none;
        }
        .verdict-safe { background: rgba(39,174,96,0.1); border: 1px solid rgba(39,174,96,0.4); }
        .verdict-suspicious { background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.4); }
        .verdict-dangerous { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.4); }

        .verdict-badge {
            display: inline-block;
            font-weight: 700;
            font-size: 16px;
            padding: 5px 14px;
            border-radius: 6px;
            color: white;
        }
        .badge-safe { background: #27ae60; }
        .badge-suspicious { background: #f39c12; }
        .badge-dangerous { background: #e74c3c; }

        .score-text {
            float: right;
            font-weight: 700;
            color: #CADCFC;
            font-size: 14px;
            margin-top: 6px;
        }

        .verdict-card h3 {
            margin: 20px 0 8px 0;
            font-size: 14px;
            color: white;
            clear: both;
        }
        .verdict-card ul { margin: 0; padding-left: 20px; }
        .verdict-card li { margin-bottom: 6px; font-size: 14px; color: #d4d9ec; }
    </style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>

<div class="page-overlay">
    <nav class="navbar">
        <span class="brand">🛡 VShield.ai</span>
        <a href="dashboard.html">Dashboard</a>
        <a href="analyze.html" class="active">Analyze</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <div class="wide-container">
        <h1>Analyze a message</h1>
        <p>Paste a suspicious message, email, or link below to check it for scam signals.</p>

        <div class="analyze-box">
            <form onsubmit="submitAnalysis(event)">
                <textarea id="messageInput" placeholder="Paste the message, email, or link here..."></textarea>
                <div id="errorBox" class="error-message"></div>
                <div id="loading" class="loading">Analyzing...</div>
                <button type="submit" id="analyzeBtn" class="analyze-btn">Analyze</button>
            </form>

            <div id="resultBox" class="verdict-card"></div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script src="analyze.js"></script>
<script>
    requireAuth();

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789';
    const fontSize = 16;
    let drops = new Array(Math.floor(canvas.width / fontSize)).fill(1);

    function draw() {
        ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            ctx.fillStyle = '#4ade80';
            ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 60);
</script>
</body>
</html>
