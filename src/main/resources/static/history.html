<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>History — VShield.ai</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .history-item {
            background: #151a3d;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .history-item:hover {
            transform: translateY(-2px);
            border-color: rgba(230,57,70,0.4);
        }
        .history-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .history-date {
            color: #6b7280;
            font-size: 12px;
        }
        .history-preview {
            color: #d4d9ec;
            font-size: 13.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .verdict-badge {
            display: inline-block;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 6px;
            color: white;
        }
        .badge-safe { background: #27ae60; }
        .badge-suspicious { background: #f39c12; }
        .badge-dangerous { background: #e74c3c; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9aa7d1;
            background: #151a3d;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
        }

        #detailOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 20;
            align-items: flex-start;
            justify-content: center;
            padding: 100px 20px 40px 20px;
            overflow-y: auto;
        }

        .verdict-card {
            position: relative;
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            padding: 26px;
        }
        .verdict-safe { background: #12301f; border: 1px solid rgba(39,174,96,0.5); }
        .verdict-suspicious { background: #332608; border: 1px solid rgba(243,156,18,0.5); }
        .verdict-dangerous { background: #331515; border: 1px solid rgba(231,76,60,0.5); }

        .score-text {
            float: right;
            font-weight: 700;
            color: #CADCFC;
            font-size: 14px;
            margin-top: 6px;
        }
        .verdict-card h3 { margin: 18px 0 8px 0; font-size: 14px; color: white; }
        .verdict-card ul { margin: 0; padding-left: 20px; }
        .verdict-card li { margin-bottom: 6px; font-size: 14px; color: #d4d9ec; }

        .close-btn {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 30px; height: 30px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); }

        .analyze-btn {
            background: linear-gradient(135deg, #E63946, #c9303c);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>

<div class="page-overlay">
    <nav class="navbar">
        <span class="brand">🛡 VShield.ai</span>
        <a href="dashboard.html">Dashboard</a>
        <a href="analyze.html">Analyze</a>
        <a href="history.html" class="active">History</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <div class="wide-container">
        <h1>Your past checks</h1>
        <p>Review every message, email, or link you've analyzed.</p>

        <div id="historyList"></div>
    </div>

    <footer class="site-footer">Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.</footer>
</div>

<div id="detailOverlay">
    <div id="detailBox" class="verdict-card"></div>
</div>

<script src="auth.js"></script>
<script src="history.js"></script>
<script>
    requireAuth().then(() => loadHistory());

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789';
    const fontSize = 16;
    let drops = new Array(Math.floor(canvas.width / fontSize)).fill(1);

    function draw() {
        ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            ctx.fillStyle = '#4ade80';
            ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 60);
</script>
<link rel="stylesheet" href="style.css">
</body>
</html>
