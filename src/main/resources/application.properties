# Application identity
spring.application.name=vshield

# Server settings
server.port=8080

# Database connection - H2 file-based storage
# This creates a real file on disk (in a 'data' folder) so our data
# survives every restart, instead of disappearing like the default in-memory mode
spring.datasource.url=jdbc:h2:file:./data/vshielddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
# ddl-auto=update means: automatically create/update database tables
# to match our Java entity classes (like User) - perfect for development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console - lets us visually inspect the database in a browser
# Only for development - never enable this in a real production app
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console